name: release-windows

# 触发：push 到 main + 手动 workflow_dispatch
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "构建完成后创建 GitHub Release 并附带 NSIS 安装包"
        type: boolean
        default: false

# 顶层权限：上传 artifact / 创建 Release 都需要 contents: write
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 让 cargo/tauri 的日志更完整，方便排查打包问题
  RUST_BACKTRACE: "1"

jobs:
  build-windows:
    name: Build NSIS installer (Windows x86_64)
    runs-on: windows-latest
    # 版本号 / 渠道全部由 scripts/version.mjs 统一推导（v.A.B.C，release | rc）
    outputs:
      version: ${{ steps.app.outputs.version }}
      channel: ${{ steps.app.outputs.channel }}
      prerelease: ${{ steps.app.outputs.prerelease }}
      display: ${{ steps.app.outputs.display }}
      release_name: ${{ steps.app.outputs.release_name }}
      asset_name: ${{ steps.app.outputs.asset_name }}
      tag: ${{ steps.app.outputs.tag }}
      title: ${{ steps.app.outputs.title }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 缓存 key 里带上目标三元组，避免与其它平台缓存串味
          key: windows-x86_64-msvc

      - name: Resolve version + channel (v.A.B.C, release | rc)
        id: app
        shell: pwsh
        run: node scripts/version.mjs --github

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests (JS 单测 + 顶栏静态校验 + Rust 单测)
        run: |
          npm run test:js
          npm run verify
          npm run test:rust

      - name: Build NSIS bundle
        run: npm run tauri build -- --bundles nsis

      - name: List bundle output
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle | Select-Object FullName, Length

      # 验证「统一 logo」真的进了产物（用户明确要求安装包与卸载器都要那只小鲸鱼，
      # 而不是 Tauri 默认图标）。
      #
      # 这里**不**做「抽 exe 图标再比像素」那套：`System.Drawing` 的图标抽取在不同
      # Windows 版本上对 PNG 压缩的 ICO 支持不一致，容易变成 flaky 断言。
      # 改为两条**确定性强**的检查：
      #   1) exe 的图标资源里确实含 ICO 数据，且与 icons/icon.ico 的**尺寸档位一致**
      #      （Tauri 会把 bundle.icon 里的 ico 嵌进 exe）；
      #   2) 配置里 installerIcon / uninstallerIcon 指向的文件存在 —— 这是安装包与
      #      卸载器图标的**唯一**来源，之前它们从未被设置，所以才会是 Tauri 默认图标。
      - name: Verify unified logo is wired into the bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json

          # 1) 安装包 / 卸载器图标必须显式指向统一 logo
          foreach ($k in @("installerIcon", "uninstallerIcon")) {
            $rel = $conf.bundle.windows.nsis.$k
            if (-not $rel) {
              throw "tauri.conf.json 缺少 nsis.$k —— 安装包/卸载器会退回 Tauri 默认图标（用户明确不要）"
            }
            $p = Join-Path "src-tauri" $rel
            if (-not (Test-Path $p)) { throw "nsis.$k 指向的文件不存在：$p" }
            Write-Host "OK  nsis.$k = $rel"
          }

          # 2) bundle.icon 必须包含 icon.ico，且该 ico 是多档的（含 256 与 16）
          $icons = @($conf.bundle.icon)
          if ($icons -notcontains "icons/icon.ico") {
            throw "bundle.icon 里没有 icons/icon.ico"
          }
          $icoPath = "src-tauri/icons/icon.ico"
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $icoPath))
          # ICO 头：reserved(2)=0, type(2)=1, count(2)=N
          $reserved = [BitConverter]::ToUInt16($bytes, 0)
          $type = [BitConverter]::ToUInt16($bytes, 2)
          $count = [BitConverter]::ToUInt16($bytes, 4)
          if ($reserved -ne 0 -or $type -ne 1) { throw "icons/icon.ico 不是合法的 ICO 文件" }
          Write-Host ("OK  icons/icon.ico 合法，含 {0} 档尺寸" -f $count)
          if ($count -lt 6) {
            throw "icons/icon.ico 只有 $count 档，期望至少 6 档（256/128/64/48/32/24/16）"
          }

          # 3) 开始菜单图标（v0.3.2 新增）：
          #    · startmenu.ico 必须被打进 bundle.resources（NSIS 钩子要从 $INSTDIR\icons\ 读它）；
          #    · 文件本身必须是合法 ICO 且多档（与 icon.ico 同一套检查）。
          #
          # 为什么单独打包一个 ico：开始菜单快捷方式的图标写在 .lnk 里，**不跟随系统主题**。
          # 深藏青的 icon.ico 落在深色开始菜单上几乎看不见，所以用一个「白鲸鱼 + 细描边」
          # 的专用图标（深浅背景都可读）。见 src-tauri/nsis-hooks.nsh。
          $resources = @($conf.bundle.resources)
          if ($resources -notcontains "icons/startmenu.ico") {
            throw "bundle.resources 里没有 icons/startmenu.ico —— NSIS 钩子找不到开始菜单图标"
          }
          $smPath = "src-tauri/icons/startmenu.ico"
          if (-not (Test-Path $smPath)) { throw "找不到 $smPath" }
          $smBytes = [System.IO.File]::ReadAllBytes((Resolve-Path $smPath))
          $smReserved = [BitConverter]::ToUInt16($smBytes, 0)
          $smType = [BitConverter]::ToUInt16($smBytes, 2)
          $smCount = [BitConverter]::ToUInt16($smBytes, 4)
          if ($smReserved -ne 0 -or $smType -ne 1) { throw "icons/startmenu.ico 不是合法的 ICO 文件" }
          if ($smCount -lt 6) {
            throw "icons/startmenu.ico 只有 $smCount 档，期望至少 6 档（256/128/64/48/32/24/16）"
          }
          Write-Host ("OK  icons/startmenu.ico 合法，含 {0} 档尺寸" -f $smCount)

          # 4) NSIS 钩子必须真的重建开始菜单快捷方式并指定图标。
          #    模板自带的 CreateOrUpdateStartMenuShortcut 在 $UpdateMode=1 时直接 Return，
          #    所以**覆盖安装永远不会修好旧图标** —— 修复只能靠这个 POSTINSTALL 钩子。
          $hooks = Get-Content src-tauri/nsis-hooks.nsh -Raw
          if ($hooks -notmatch "NSIS_HOOK_POSTINSTALL") {
            throw "nsis-hooks.nsh 没有 NSIS_HOOK_POSTINSTALL —— 旧安装的开始菜单图标不会被修复"
          }
          if ($hooks -notmatch "startmenu\.ico") {
            throw "nsis-hooks.nsh 没有引用 startmenu.ico —— 快捷方式图标仍会继承 exe 资源"
          }
          if ($hooks -notmatch "SHChangeNotify") {
            throw "nsis-hooks.nsh 没有调 SHChangeNotify —— shell 图标缓存不刷新，用户仍看到旧图标"
          }
          Write-Host "OK  nsis-hooks.nsh 会重建开始菜单快捷方式并刷新图标缓存"

          # 5) 打包产物里 exe 与安装器都要存在（确认构建真的产出了东西）
          $exe = "src-tauri/target/release/dshtauri.exe"
          if (-not (Test-Path $exe)) { throw "找不到 $exe" }
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $setup) { throw "找不到 NSIS 安装包" }
          Write-Host ("OK  产物：{0} / {1}" -f (Split-Path $exe -Leaf), $setup[0].Name)

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          # 名字里带渠道，RC 与正式版各自的包不会互相覆盖
          name: ${{ steps.app.outputs.release_name }}-nsis
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 30

  # 在真实的 windows-latest 上启动应用本体做冒烟测试。
  # 这一步专门用来抓「只有 Windows 才会暴露」的问题：
  # 例如「在同步命令（主线程）里创建窗口导致主线程死锁」→ 白屏 + 点 × 无反应。
  smoke-windows:
    name: Windows GUI smoke test (real app)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x86_64-msvc-smoke

      - name: Install frontend dependencies
        run: npm ci

      - name: Build debug binary
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Run Windows GUI smoke test
        id: smoke
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $log = "$env:RUNNER_TEMP\dshtauri-smoke\smoke-console.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path $log) | Out-Null
          # 先把文件建出来：万一脚本**解析失败 / Add-Type 抛异常**（会直接终止、
          # 一个输出对象都到不了 Tee-Object），日志文件仍然存在，ci-logs 里能看到线索
          # —— 之前吃过一次亏：脚本早退导致发布的日志只有表头，完全无法定位。
          Set-Content -Path $log -Value "" -NoNewline
          $code = 0
          try {
            & ./scripts/smoke-windows.ps1 -AppPath src-tauri/target/debug/dshtauri.exe *>&1 |
              Tee-Object -FilePath $log -Append
            $code = $LASTEXITCODE
          } catch {
            ("===== 冒烟脚本提前失败（异常）=====" + "`n" + ($_ | Out-String)) |
              Tee-Object -FilePath $log -Append
            $code = 1
          }
          exit $code

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows-logs
          path: ${{ runner.temp }}/dshtauri-smoke/
          if-no-files-found: ignore

      # 把冒烟输出推到 ci-logs 分支：job 日志要 token 才能读，
      # 而 raw.githubusercontent.com 不需要，方便在本地/无 token 环境下排查。
      # 这个分支不触发 workflow（本工作流只在 main 上跑）。
      - name: Publish smoke output to ci-logs branch
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          function Invoke-Git([string[]]$GitArgs) {
            & git @GitArgs
            if ($LASTEXITCODE -ne 0) { throw "git $($GitArgs -join ' ') 失败（exit $LASTEXITCODE）" }
          }

          $dir = Join-Path $env:RUNNER_TEMP "dshtauri-smoke"
          # 必须写在仓库工作区内，否则 git add 会报 "is outside repository"
          $out = Join-Path $env:GITHUB_WORKSPACE "smoke-windows.txt"

          $lines = @(
            "run_id: ${{ github.run_id }}",
            "sha:    ${{ github.sha }}",
            "result: ${{ steps.smoke.outcome }}",
            "session: $((Get-Process -Id $PID).SessionId)"
          )
          if (Test-Path $dir) {
            Get-ChildItem $dir -File | Sort-Object Name | ForEach-Object {
              $lines += ""
              $lines += "===== $($_.Name) ====="
              $lines += (Get-Content $_.FullName -Raw)
            }
          }
          Set-Content -Path $out -Value ($lines -join "`n") -Encoding utf8

          Invoke-Git @("config", "user.email", "ci@dshtauri.local")
          Invoke-Git @("config", "user.name", "DSHTauri CI")
          Invoke-Git @("checkout", "-q", "-B", "ci-logs")
          Invoke-Git @("add", "-f", "smoke-windows.txt")
          Invoke-Git @("commit", "-q", "-m", "ci: smoke output for run ${{ github.run_id }}")
          Invoke-Git @("push", "-q", "-f", "origin", "ci-logs")
          Write-Host "smoke output published to ci-logs/smoke-windows.txt"

      - name: Fail job if smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Windows GUI smoke test failed — 详情见 ci-logs 分支的 smoke-windows.txt"
          exit 1

  release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    # 只有手动触发并勾选 create_release 时才创建 Release
    if: github.event_name == 'workflow_dispatch' && inputs.create_release

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.build-windows.outputs.release_name }}-nsis
          path: dist
          merge-multiple: true

      - name: Rename installer to release asset name
        run: |
          set -euo pipefail
          asset="${{ needs.build-windows.outputs.asset_name }}"
          src="$(ls dist/*.exe | head -1)"
          mv "$src" "dist/$asset"
          ls -l dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # 渠道决定 tag：正式版 v.0.3.2，候选版 v.0.3.2-rc，两者互不覆盖
          tag_name: ${{ needs.build-windows.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build-windows.outputs.title }}
          draft: false
          prerelease: ${{ needs.build-windows.outputs.prerelease }}
          files: dist/*.exe
