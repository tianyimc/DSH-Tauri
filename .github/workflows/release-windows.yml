name: release-windows

# 触发：push 到 main + 手动 workflow_dispatch
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "构建完成后创建 GitHub Release 并附带 NSIS 安装包"
        type: boolean
        default: false

# 顶层权限：上传 artifact / 创建 Release 都需要 contents: write
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 让 cargo/tauri 的日志更完整，方便排查打包问题
  RUST_BACKTRACE: "1"

jobs:
  build-windows:
    name: Build NSIS installer (Windows x86_64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.app.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 缓存 key 里带上目标三元组，避免与其它平台缓存串味
          key: windows-x86_64-msvc

      - name: Read app version
        id: app
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          "version=$($conf.version)" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS bundle
        run: npm run tauri build -- --bundles nsis

      - name: List bundle output
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle | Select-Object FullName, Length

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: dshtauri-nsis-${{ steps.app.outputs.version }}-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    # 只有手动触发并勾选 create_release 时才创建 Release
    if: github.event_name == 'workflow_dispatch' && inputs.create_release

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          pattern: dshtauri-nsis-*
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -l dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # 由 action 自动创建该 tag（指向本次运行的 commit）
          tag_name: v${{ needs.build-windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DSHTauri v${{ needs.build-windows.outputs.version }}
          draft: false
          prerelease: false
          files: dist/*.exe
