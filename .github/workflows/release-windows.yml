name: release-windows

# 触发：push 到 main + 手动 workflow_dispatch
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "构建完成后创建 GitHub Release 并附带 NSIS 安装包"
        type: boolean
        default: false

# 顶层权限：上传 artifact / 创建 Release 都需要 contents: write
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 让 cargo/tauri 的日志更完整，方便排查打包问题
  RUST_BACKTRACE: "1"

jobs:
  build-windows:
    name: Build NSIS installer (Windows x86_64)
    runs-on: windows-latest
    # 版本号全部由 scripts/version.mjs 统一推导（v.A.B.C GenX）
    outputs:
      version: ${{ steps.app.outputs.version }}
      generation: ${{ steps.app.outputs.generation }}
      display: ${{ steps.app.outputs.display }}
      release_name: ${{ steps.app.outputs.release_name }}
      asset_name: ${{ steps.app.outputs.asset_name }}
      tag: ${{ steps.app.outputs.tag }}
      title: ${{ steps.app.outputs.title }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 缓存 key 里带上目标三元组，避免与其它平台缓存串味
          key: windows-x86_64-msvc

      - name: Resolve version (v.A.B.C GenX)
        id: app
        shell: pwsh
        run: node scripts/version.mjs --github

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests (JS 单测 + 顶栏静态校验 + Rust 单测)
        run: |
          npm run test:js
          npm run verify
          npm run test:rust

      - name: Build NSIS bundle
        run: npm run tauri build -- --bundles nsis

      - name: List bundle output
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle | Select-Object FullName, Length

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          # 名字里带 Gen，同一个 C 版本的多代包不会互相覆盖
          name: ${{ steps.app.outputs.release_name }}-nsis
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 30

  # 在真实的 windows-latest 上启动应用本体做冒烟测试。
  # 这一步专门用来抓「只有 Windows 才会暴露」的问题：
  # 例如「在同步命令（主线程）里创建窗口导致主线程死锁」→ 白屏 + 点 × 无反应。
  smoke-windows:
    name: Windows GUI smoke test (real app)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x86_64-msvc-smoke

      - name: Install frontend dependencies
        run: npm ci

      - name: Build debug binary
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Run Windows GUI smoke test
        id: smoke
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $log = "$env:RUNNER_TEMP\dshtauri-smoke\smoke-console.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path $log) | Out-Null
          # 先把文件建出来：万一脚本**解析失败 / Add-Type 抛异常**（会直接终止、
          # 一个输出对象都到不了 Tee-Object），日志文件仍然存在，ci-logs 里能看到线索
          # —— 之前吃过一次亏：脚本早退导致发布的日志只有表头，完全无法定位。
          Set-Content -Path $log -Value "" -NoNewline
          $code = 0
          try {
            & ./scripts/smoke-windows.ps1 -AppPath src-tauri/target/debug/dshtauri.exe *>&1 |
              Tee-Object -FilePath $log -Append
            $code = $LASTEXITCODE
          } catch {
            ("===== 冒烟脚本提前失败（异常）=====" + "`n" + ($_ | Out-String)) |
              Tee-Object -FilePath $log -Append
            $code = 1
          }
          exit $code

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows-logs
          path: ${{ runner.temp }}/dshtauri-smoke/
          if-no-files-found: ignore

      # 把冒烟输出推到 ci-logs 分支：job 日志要 token 才能读，
      # 而 raw.githubusercontent.com 不需要，方便在本地/无 token 环境下排查。
      # 这个分支不触发 workflow（本工作流只在 main 上跑）。
      - name: Publish smoke output to ci-logs branch
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          function Invoke-Git([string[]]$GitArgs) {
            & git @GitArgs
            if ($LASTEXITCODE -ne 0) { throw "git $($GitArgs -join ' ') 失败（exit $LASTEXITCODE）" }
          }

          $dir = Join-Path $env:RUNNER_TEMP "dshtauri-smoke"
          # 必须写在仓库工作区内，否则 git add 会报 "is outside repository"
          $out = Join-Path $env:GITHUB_WORKSPACE "smoke-windows.txt"

          $lines = @(
            "run_id: ${{ github.run_id }}",
            "sha:    ${{ github.sha }}",
            "result: ${{ steps.smoke.outcome }}",
            "session: $((Get-Process -Id $PID).SessionId)"
          )
          if (Test-Path $dir) {
            Get-ChildItem $dir -File | Sort-Object Name | ForEach-Object {
              $lines += ""
              $lines += "===== $($_.Name) ====="
              $lines += (Get-Content $_.FullName -Raw)
            }
          }
          Set-Content -Path $out -Value ($lines -join "`n") -Encoding utf8

          Invoke-Git @("config", "user.email", "ci@dshtauri.local")
          Invoke-Git @("config", "user.name", "DSHTauri CI")
          Invoke-Git @("checkout", "-q", "-B", "ci-logs")
          Invoke-Git @("add", "-f", "smoke-windows.txt")
          Invoke-Git @("commit", "-q", "-m", "ci: smoke output for run ${{ github.run_id }}")
          Invoke-Git @("push", "-q", "-f", "origin", "ci-logs")
          Write-Host "smoke output published to ci-logs/smoke-windows.txt"

      - name: Fail job if smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Windows GUI smoke test failed — 详情见 ci-logs 分支的 smoke-windows.txt"
          exit 1

  release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    # 只有手动触发并勾选 create_release 时才创建 Release
    if: github.event_name == 'workflow_dispatch' && inputs.create_release

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.build-windows.outputs.release_name }}-nsis
          path: dist
          merge-multiple: true

      - name: Rename installer to release asset name
        run: |
          set -euo pipefail
          asset="${{ needs.build-windows.outputs.asset_name }}"
          src="$(ls dist/*.exe | head -1)"
          mv "$src" "dist/$asset"
          ls -l dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # 同一 C 版本的多代包各自一个 tag（v1.1.11 / v1.1.11Gen2），不会互相覆盖
          tag_name: ${{ needs.build-windows.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build-windows.outputs.title }}
          draft: false
          prerelease: false
          files: dist/*.exe
