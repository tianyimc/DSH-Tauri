[package]
name = "dshtauri"
version = "0.1.0"
description = "DSHTauri - lightweight Tauri 2 desktop shell for the DSH WebUI"
authors = ["DSHTauri"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri 2 官方模板布局：逻辑放 lib，main.rs 只是薄壳（也方便以后接移动端）。
name = "dshtauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon = Tauri 2 官方托盘 API；不需要额外插件。
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 目标：体积尽量小、内存占用尽量低。
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false
