[package]
name = "dshtauri"
version = "0.1.1"
description = "DSHTauri - lightweight Tauri 2 desktop shell for the DSH WebUI"
authors = ["DSHTauri"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri 2 官方模板布局：逻辑放 lib，main.rs 只是薄壳（也方便以后接移动端）。
name = "dshtauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 用它读 version.json 里的 Gen 号
serde_json = "1"

[dependencies]
# tray-icon   = Tauri 2 官方托盘 API，不需要额外插件
# image-png   = 让托盘图标能从内嵌 PNG 字节解码（Image::from_bytes）
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 仅 Windows：用作业对象（Job Object）保证应用启动的本地服务随主程序一起结束
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
# 目标：体积尽量小、内存占用尽量低。
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false
