[package]
name = "dshtauri"
version = "0.3.2"
description = "DSHTauri - lightweight Tauri 2 desktop shell for the DSH WebUI"
authors = ["DSHTauri"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri 2 官方模板布局：逻辑放 lib，main.rs 只是薄壳（也方便以后接移动端）。
name = "dshtauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 用它读 version.json 里的 Gen 号
serde_json = "1"

[dependencies]
# tray-icon   = Tauri 2 官方托盘 API，不需要额外插件
# image-png   = 让托盘图标能从内嵌 PNG 字节解码（Image::from_bytes）
# unstable    = multiwebview API（`Window::add_child`）：顶栏是主窗口内的一个**子 webview**，
#               这样它跑在本地上下文（有 IPC），且位置由客户区坐标决定，
#               不存在旧实现「独立窗口 + 手工同步几何」导致的错位。
#               注意：官方文档把该 API 标记为 unstable，但它已是 Tauri 2 稳定版里的既有能力，
#               本项目锁定 2.x，升级时需复查 `add_child` 是否仍在。
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 仅 Windows：用作业对象（Job Object）保证应用启动的本地服务随主程序一起结束
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    # SystemParametersInfoW + SPI_GETCLIENTAREAANIMATION：
    # 读取 Windows 11「设置 → 辅助功能 → 视觉效果 → 动画效果」开关，
    # 关掉时我们不做过渡动画（见 src/anim.rs）。
    "Win32_UI_WindowsAndMessaging",
    # RegGetValueW + HKEY_CURRENT_USER：读取 `SystemUsesLightTheme`，
    # 判断**任务栏**（外壳）是深色还是浅色 —— 它与「应用深浅色」是两个独立开关，
    # 任务栏图标/托盘必须按前者选色（见 src/win_icon.rs）。
    "Win32_System_Registry",
    # ShellExecuteW：「关于 → 检查更新」里把下载链接交给**系统默认浏览器**打开。
    # 不启用 tauri-plugin-opener 也能做到，且不会让「关于」窗口自己被导航走。
    "Win32_UI_Shell",
    # timeBeginPeriod / timeEndPeriod（winmm）：把系统定时器粒度压到 1ms，
    # 否则 `sleep(15ms)` 实际会睡 15~31ms，帧间隔抖动 = 看起来「一顿一顿」（见 src/anim.rs）。
    "Win32_Media",
] }
# 用来把「会话 cookie」改成「持久 cookie」，否则每次启动都要重新登录
# （Cloudflare Access 的 CF_Authorization 就是会话 cookie）
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
# 目标：体积尽量小、内存占用尽量低。
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false
