<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>关于 DSHTauri</title>
    <link rel="stylesheet" href="about.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <!-- 统一鲸鱼 logo（与托盘/任务栏同一只）：深色底用白鲸鱼，浅色底用深藏青鲸鱼 -->
        <span class="logo" aria-hidden="true">
          <img class="logo-on-dark" src="logo-on-dark.png" alt="" />
          <img class="logo-on-light" src="logo-on-light.png" alt="" />
        </span>
        <div>
          <h1>DSHTauri</h1>
          <p class="ver">
            <span id="version">…</span>
            <span class="badge" id="channel-badge">…</span>
          </p>
        </div>
      </header>

      <p class="desc">
        DSH WebUI 的 Windows 轻量桌面壳：Tauri 2 + 系统原生 WebView2，不捆绑 Chromium。
      </p>

      <section class="box">
        <h2>检查更新</h2>
        <p class="muted" id="update">点「检查更新」会同时检查 Release 与 RC 两个通道。</p>
        <div class="channels" id="channels"></div>
        <div class="confirm" id="confirm" hidden>
          <p class="confirm-text" id="confirm-text"></p>
          <div class="confirm-actions">
            <button id="confirm-ok" type="button">继续下载</button>
            <button id="confirm-cancel" type="button">取消</button>
          </div>
        </div>
      </section>

      <section class="box">
        <h2>项目地址</h2>
        <p class="mono selectable">https://github.com/tianyimc/DSH-Tauri</p>
        <p class="muted">
          版本规则：<span class="mono">v.A.B.C</span>，RC 版附 <span class="mono"> RC</span> 后缀；发布版无后缀。详见仓库的 CHANGELOG.md。
        </p>
      </section>

      <section class="box">
        <h2>作者与声明</h2>
        <p class="muted">
          作者：<a class="link selectable" href="https://tianyimc.com" target="_blank" rel="noopener noreferrer">© tianyimc.com</a>
        </p>
        <p class="muted note">
          DSHTauri 是第三方开源客户端，<strong>与 DeepSeek 官方无关，也未获得其背书</strong>。
        </p>
      </section>

      <footer class="foot">
        <button id="btn-check" type="button">检查更新</button>
        <button id="btn-close" type="button">关闭</button>
      </footer>
    </main>

    <script type="module" src="about.js"></script>
  </body>
</html>
