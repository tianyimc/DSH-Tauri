<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DSHTauri</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body>
    <!-- 主窗口是无边框的，这条 40px 的横条就是它的标题栏 -->
    <div class="bar" id="bar">
      <button class="menu" id="btn-app" type="button">应用</button>
      <button class="menu" id="btn-actions" type="button">操作</button>
      <button class="menu" id="btn-chat" type="button">网页对话</button>

      <div class="spacer"></div>

      <div class="controls">
        <button class="ctl" id="btn-min" type="button" title="最小化">&#xE921;</button>
        <button class="ctl" id="btn-max" type="button" title="最大化 / 还原">&#xE922;</button>
        <button class="ctl close" id="btn-close" type="button" title="关闭到托盘">&#xE8BB;</button>
      </div>
    </div>

    <script type="module" src="chrome.js"></script>
  </body>
</html>
