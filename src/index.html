<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选择 DSH 连接方式</title>
    <link rel="stylesheet" href="selector.css" />
  </head>
  <body>
    <main class="shell">
      <header class="head">
        <div class="brand">
          <span class="dot"></span>
          <h1>选择 DSH 连接方式</h1>
        </div>
        <button id="toggle-settings" class="ghost" type="button" title="编辑地址与启动命令">
          设置
        </button>
      </header>

      <!-- ============ 主选择区 ============ -->
      <section id="picker" class="picker">
        <button id="pick-local" class="card" type="button">
          <span class="card-icon" aria-hidden="true">⌂</span>
          <span class="card-body">
            <span class="card-title">本地</span>
            <span class="card-url" id="label-local">未配置（点击填写）</span>
          </span>
          <span class="card-badge" id="badge-local">未配置</span>
        </button>

        <button id="pick-remote" class="card" type="button">
          <span class="card-icon" aria-hidden="true">☁</span>
          <span class="card-body">
            <span class="card-title">远程</span>
            <span class="card-url" id="label-remote">未配置（点击填写）</span>
          </span>
          <span class="card-badge" id="badge-remote">未配置</span>
        </button>
      </section>

      <!-- ============ 首次配置 / 设置面板 ============ -->
      <section id="setup" class="setup" hidden>
        <p class="setup-hint" id="setup-hint">
          本地和远程<strong>至少填一个</strong>，另一个留空即可。保存后写入配置文件，之后每次启动直接选择即可。
        </p>

        <label class="field">
          <span class="field-label">本地 URL<span class="opt">（可留空）</span></span>
          <input
            id="input-local"
            type="text"
            spellcheck="false"
            placeholder="示例：http://127.0.0.1:3080"
          />
        </label>

        <label class="field">
          <span class="field-label">远程 URL<span class="opt">（可留空）</span></span>
          <input
            id="input-remote"
            type="text"
            spellcheck="false"
            placeholder="示例：https://dsh.example.com"
          />
        </label>

        <label class="check">
          <input id="input-autostart" type="checkbox" />
          <span>选择“本地”时自动执行下面的命令（启动本地 DSH 服务）</span>
        </label>

        <label class="field" id="field-command">
          <span class="field-label">本地服务启动命令（PowerShell）</span>
          <textarea
            id="input-command"
            rows="3"
            spellcheck="false"
            placeholder="示例：dsh web"
          ></textarea>
          <span class="field-help">
            通过 <code>powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -Command "…"</code>
            在后台执行，窗口不会弹出。留空则不做任何事（由你手动启动服务）。
          </span>
        </label>

        <div class="actions">
          <button id="save-setup" class="primary" type="button">保存</button>
          <button id="cancel-setup" class="ghost" type="button">取消</button>
        </div>
      </section>

      <p id="status" class="status" role="status"></p>
      <footer class="foot">
        <span id="foot-config">配置未加载</span>
        <span id="foot-version" class="ver"></span>
      </footer>
    </main>

    <!-- Tauri 2 全局 API（tauri.conf.json -> app.withGlobalTauri = true）。
         用 ES module：selector.js 从 config-rules.js 引入可测试的配置校验逻辑。 -->
    <script type="module" src="selector.js"></script>
  </body>
</html>
