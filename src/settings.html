<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <title>DSHTauri 设置</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <!--
      设置窗口：独立 WebviewWindow（label = settings），加载**本地** settings.html，
      因此命中 capabilities/default.json 的 windows 列表 ⇒ 有 IPC。

      它只做两件事：
        1) 复用「重新选择连接方式」（= 顶栏「应用 → 重新连接」/ 托盘同名项）；
        2) 切换「网页对话」的加载模式（overlay / docked），保存后布局**立即**变化。
    -->
    <main class="wrap">
      <header class="head">
        <span class="logo" aria-hidden="true">⚙️</span>
        <div>
          <h1>设置</h1>
          <p class="ver" id="version">…</p>
        </div>
      </header>

      <!-- 连接 -->
      <section class="box">
        <h2>连接方式</h2>
        <p class="muted" id="conn-summary">正在读取配置…</p>
        <p class="row">
          <button id="btn-reconnect" type="button">重新选择连接方式…</button>
          <span class="muted">与托盘菜单里的同名项完全一致：把选择窗口叫到最前。</span>
        </p>
      </section>

      <!-- 网页对话加载模式（核心） -->
      <section class="box">
        <h2>网页对话的加载模式</h2>
        <p class="muted">
          「网页对话」是右侧那个 <code>chat.deepseek.com</code> 侧栏。两种模式的差别只在
          <strong>主页面要不要给它让出宽度</strong>，<strong>都不会改变程序窗口的大小</strong>。
        </p>

        <fieldset class="modes" id="modes">
          <legend class="sr-only">网页对话加载模式</legend>

          <label class="mode" for="mode-overlay">
            <input type="radio" name="chat-mode" id="mode-overlay" value="overlay" />
            <span class="mode-body">
              <span class="mode-title">覆盖（overlay）<span class="tag">默认</span></span>
              <span class="mode-hint"
                >侧栏浮在主页面之上，主页面保持整宽。适合临时看一眼对话。</span
              >
            </span>
          </label>

          <label class="mode" for="mode-docked">
            <input type="radio" name="chat-mode" id="mode-docked" value="docked" />
            <span class="mode-body">
              <span class="mode-title">并排（docked）</span>
              <span class="mode-hint"
                >主页面让出右侧 420px，与侧栏并排显示，互不遮挡。适合长时间边看边聊。</span
              >
            </span>
          </label>
        </fieldset>

        <p class="muted" id="mode-note">
          提示：并排模式只影响<strong>已打开</strong>的侧栏；还没点过「网页对话」时两种模式看起来一样。
        </p>
      </section>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <footer class="foot">
        <button id="btn-close" type="button">关闭</button>
      </footer>
    </main>

    <script type="module" src="settings.js"></script>
  </body>
</html>
